kind: wasmer.io/App.v0
name: barberz
app_id: da_KD4Iat7UJ84g
owner: pwa0909
package: .
env:
  PHPIX_PHP_THREADS: '4'
  CACHE_STORE: file
  SESSION_DRIVER: cookie
  DB_CONNECTION: mysql
capabilities:
  database:
    engine: mysql
jobs:
- name: after_deploy
  trigger: post-deployment
  action:
    execute:
      command: php artisan migrate --force
annotations:
  anybuild.run/config:
    composer_build_script: post-update-cmd
    composer_enable: true
    name: out
    node_build_command: npm run build
    node_install_inputs:
    - package.json
    node_package_manager: npm
    php_framework: laravel
    php_public_dir: public
    phpix: true
    npm_version: '11'
  anybuild.run/provider: laravel
  anybuild.run/version: 0.33.0
  wasmer.io/version: 7.5.0
enableDatabase: true
enable_email: true
